events {
    worker_connections 1024;
}

http {
    # API Gateway: Rate Limiting (máximo 5 peticiones por segundo por IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # Load Balancer (Round-Robin entre las 2 tareas de ECS)
    upstream ecs_cluster_upstream {
        server ecs-task-1:8000;
        server ecs-task-2:8000;
    }

    upstream lambda_upstream {
        server lambda-validator:8080;
    }

    server {
        listen 80;

        # Reverse Proxy Header Hardening
        add_header X-Gateway-Provider "NGINX-API-Gateway" always;

        # Ruta 1: Hacia el clúster balanceado de contenedores ECS
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://ecs_cluster_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Ruta 2: Hacia la función Serverless AWS Lambda
        location /serverless/invoke {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://lambda_upstream/2015-03-31/functions/function/invocations;
            proxy_set_header Content-Type "application/json";
        }
    }
}